# File-based password authenticator for the TLS test container ("trino-odbc-tls").
# Copied verbatim by gen_tls_assets.sh and mounted at /etc/trino/password-authenticator.properties.
#
# /etc/trino/password.db is generated by gen_tls_assets.sh with one PBKDF2 line per user in the
# format Trino's file authenticator accepts:  user:<iterations>:<salt hex>:<hash hex>
# (hashlib.pbkdf2_hmac("sha1", password, salt, 1000, 32) — no htpasswd/bcrypt tooling needed).
password-authenticator.name=file
file.password-file=/etc/trino/password.db
