# Spooling manager TEMPLATE for the TLS test container ("trino-odbc-tls"); rendered by
# gen_tls_assets.sh and mounted at /etc/trino/spooling-manager.properties.
#
# Trino 483's filesystem spooling manager only supports S3, GCS and Azure locations (no local
# directory), so run_trino.sh starts a MinIO container on the shared Docker network and creates the
# bucket with mc. The endpoint is the MinIO container's name on that network; because
# config.properties selects protocol.spooling.retrieval-mode=COORDINATOR_PROXY the ODBC client
# fetches segments from the coordinator and never needs to reach MinIO itself.
spooling-manager.name=filesystem
fs.s3.enabled=true
fs.location=s3://@SPOOLING_BUCKET@/
s3.endpoint=@MINIO_ENDPOINT@
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=@MINIO_ACCESS_KEY@
s3.aws-secret-key=@MINIO_SECRET_KEY@
# Segments are encrypted with per-segment SSE-C keys by default; MinIO (like S3) only accepts
# SSE-C over HTTPS and Trino then silently falls back to inlining every segment ("Failed to spool
# segment ... falling back to inlining" in the server log), which would leave the spooled path
# untested. Plain segments are fine for a throw-away test bucket.
fs.segment.encryption=false
