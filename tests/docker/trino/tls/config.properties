# Trino coordinator configuration TEMPLATE for the TLS test container ("trino-odbc-tls").
#
# tests/docker/trino/gen_tls_assets.sh renders this file into the generated assets directory,
# replacing the @...@ markers with freshly generated secrets, and run_trino.sh mounts the rendered
# copy at /etc/trino/config.properties. The file is not usable unrendered.
#
# What it enables (see tests/docker/README.md):
#   * HTTPS on 8443 with the self-signed PKCS#12 keystore (subjectAltName localhost/127.0.0.1/
#     ::1/<container name>/host.docker.internal) so SSLVerification=Full works with TrustedCerts=cert.pem
#   * PASSWORD authentication through the file authenticator (password-authenticator.properties,
#     user/password from gen_tls_assets.sh; defaults alice/secret) — the driver's
#     AuthenticationType=LDAP path is HTTP Basic, which is what this authenticator consumes
#   * the plain HTTP port stays open (allow-insecure-over-http) for the driver's
#     AllowInsecurePassword=1 test path; discovery also uses it
#   * the spooled result protocol (spooling-manager.properties) with COORDINATOR_PROXY retrieval so
#     the client never needs to reach the MinIO container directly
coordinator=true
node-scheduler.include-coordinator=true
catalog.management=static
http-server.http.port=8080
discovery.uri=http://localhost:8080
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/keystore.p12
http-server.https.keystore.key=@KEYSTORE_PASSWORD@
http-server.authentication.type=PASSWORD
http-server.authentication.allow-insecure-over-http=true
# Required as soon as authentication is enabled (internal node-to-node traffic is authenticated).
internal-communication.shared-secret=@INTERNAL_SHARED_SECRET@
protocol.spooling.enabled=true
# 256-bit key, base64 (openssl rand -base64 32); Trino refuses keys that do not decode to 32 bytes.
protocol.spooling.shared-secret-key=@SPOOLING_SHARED_SECRET_KEY@
protocol.spooling.retrieval-mode=COORDINATOR_PROXY
