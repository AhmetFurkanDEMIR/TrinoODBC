# Trino coordinator configuration for the plain-HTTP test container ("trino-odbc-test", started by
# tests/docker/trino/run_trino.sh and mounted read-only at /etc/trino/config.properties).
#
# Single node, no authentication, classic (non-spooled) result protocol: this container exercises
# the driver's default code path. Password authentication, HTTPS and the spooled protocol are
# covered by the TLS container (tls/config.properties). Catalogs come from the generated
# /etc/trino/catalog directory (tpch + memory), not from the image defaults, so both containers
# expose exactly the same catalogs.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=static
